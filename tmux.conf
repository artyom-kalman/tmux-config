# ====== Core Settings ======
set-option -sa terminal-overrides ",xterm*:Tc"
set -g default-terminal "tmux-256color"  # Better color support
set -g escape-time 50                    # Faster escape sequences
set -g focus-events on                   # Better terminal integration
set -g history-limit 50000               # Bigger scrollback
set -g set-clipboard on                  # System clipboard integration
set -g allow-passthrough on              # Image/OSC passthrough
setw -g aggressive-resize on             # Resize to smallest viewer, not session
set -g detach-on-destroy off             # Stay attached when killing a session
set -g extended-keys on                  # Modern keyboard support
set -g extended-keys-format csi-u

# ====== Key Bindings ======
set -g prefix C-e

# Keep the legacy prefix+g Claude popup disabled.
unbind g

unbind r
bind r source-file ~/.config/tmux/tmux.conf

bind  c  new-window      -c "#{pane_current_path}"
bind  %  split-window -h -c "#{pane_current_path}"

# Vim-style pane navigation
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

# Vi-mode copy (v = begin selection, y = yank)
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Alt+1..9 jumps directly to that window
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Alt+arrow cycles windows; Alt+Shift+arrow swaps them
bind -n M-Left  select-window -t -1
bind -n M-Right select-window -t +1
bind -n M-S-Left  swap-window -t -1 \; select-window -t -1
bind -n M-S-Right swap-window -t +1 \; select-window -t +1

# Ctrl+Alt+Shift+arrow resizes the active pane
bind -n C-M-S-Left  resize-pane -L 5
bind -n C-M-S-Down  resize-pane -D 5
bind -n C-M-S-Up    resize-pane -U 5
bind -n C-M-S-Right resize-pane -R 5

# Rename / kill helpers (R because r reloads config)
bind R command-prompt -I "#W" "rename-window -- '%%'"
bind x kill-pane

# Create an isolated task worktree and open it in a standard tool session.
bind W command-prompt -p "task/branch:" \
  "run-shell '/home/artyom/.local/bin/tmux-new-worktree \"#{pane_current_path}\" \"%%\" \"#{client_name}\"'"

# ====== Mouse & UI ======
set -g mouse on                          # Enable mouse support
set -g base-index 1                      # Start window numbering at 1
setw -g pane-base-index 1                # Start pane numbering at 1
set -g renumber-windows on               # Re-number windows after closing
setw -g monitor-activity on              # Mark windows with background output
set -g visual-activity off               # ...but don't flash a message

# Rename numeric sessions to start from 1 instead of 0
set-hook -g session-created 'run-shell "name=\"$(tmux display-message -p \"##S\")\"; [ \"$name\" -eq \"$name\" ] 2>/dev/null && tmux rename-session -t \"$name\" \"$((name + 1))\" || true"'

# ======Plugins===========
set -g @plugin 'catppuccin/tmux#v2.1.3' 
set -g @catppuccin_flavor "macchiato"
set -g @catppuccin_window_status_style "none"

set -g @plugin 'tmux-plugins/tmux-sensible' 
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @plugin 'tmux-plugins/tmux-logging'

# ======Auto-restor=======
set -g @continuum-restore 'on'

# Initialize TPM (must be at the bottom)
run '~/.config/tmux/plugins/tpm/tpm'

# ── App-aware window tab colors ──
# claude=terracotta  codex=openai-green  nvim=green  lazygit=blue  bun=gold  cursor=composer-pink  default=catppuccin
# Codex is intentionally identified by the window name, rather than the transient pane command.
set -g @_w_nbg  "#{?#{m:claude,#{pane_current_command}},#d97757,#{?#{m:codex,#{window_name}},#10a37f,#{?#{m:nvim,#{pane_current_command}},#57a143,#{?#{m:lazygit,#{pane_current_command}},#7aa2f7,#{?#{m:bun,#{pane_current_command}},#f9c859,#{?#{m:agent,#{pane_current_command}},#9d4b6a,#5b8c85}}}}}}"
set -g @_w_nfg  "#{?#{m:claude,#{pane_current_command}},#1e2030,#{?#{m:codex,#{window_name}},#061b16,#{?#{m:nvim,#{pane_current_command}},#1e2030,#{?#{m:lazygit,#{pane_current_command}},#1e2030,#{?#{m:bun,#{pane_current_command}},#1e2030,#{?#{m:agent,#{pane_current_command}},#ffe4ef,#1e2030}}}}}}"
set -g @_w_tbg  "#{?#{m:claude,#{pane_current_command}},#493429,#{?#{m:codex,#{window_name}},#17352f,#{?#{m:nvim,#{pane_current_command}},#1e3220,#{?#{m:lazygit,#{pane_current_command}},#1e2a4a,#{?#{m:bun,#{pane_current_command}},#3d3122,#{?#{m:agent,#{pane_current_command}},#2a1722,#1e2f2d}}}}}}"
set -g @_w_tfg  "#{?#{m:claude,#{pane_current_command}},#d97757,#{?#{m:codex,#{window_name}},#7fffd4,#{?#{m:nvim,#{pane_current_command}},#57a143,#{?#{m:lazygit,#{pane_current_command}},#7aa2f7,#{?#{m:bun,#{pane_current_command}},#f9c859,#{?#{m:agent,#{pane_current_command}},#f0a3bd,#8bd5ca}}}}}}"
# Current window: same app colors, brighter catppuccin defaults
set -g @_wc_nbg "#{?#{m:claude,#{pane_current_command}},#d97757,#{?#{m:codex,#{window_name}},#10a37f,#{?#{m:nvim,#{pane_current_command}},#57a143,#{?#{m:lazygit,#{pane_current_command}},#7aa2f7,#{?#{m:bun,#{pane_current_command}},#f9c859,#{?#{m:agent,#{pane_current_command}},#e9729d,#{@thm_mauve}}}}}}}"
set -g @_wc_nfg "#{?#{m:claude,#{pane_current_command}},#1e2030,#{?#{m:codex,#{window_name}},#061b16,#{?#{m:nvim,#{pane_current_command}},#1e2030,#{?#{m:lazygit,#{pane_current_command}},#1e2030,#{?#{m:bun,#{pane_current_command}},#1e2030,#{?#{m:agent,#{pane_current_command}},#1a1b26,#{@thm_crust}}}}}}}"
set -g @_wc_tbg "#{?#{m:claude,#{pane_current_command}},#493429,#{?#{m:codex,#{window_name}},#17352f,#{?#{m:nvim,#{pane_current_command}},#1e3220,#{?#{m:lazygit,#{pane_current_command}},#1e2a4a,#{?#{m:bun,#{pane_current_command}},#3d3122,#{?#{m:agent,#{pane_current_command}},#3d2533,#{@thm_surface_1}}}}}}}"
set -g @_wc_tfg "#{?#{m:claude,#{pane_current_command}},#d97757,#{?#{m:codex,#{window_name}},#7fffd4,#{?#{m:nvim,#{pane_current_command}},#57a143,#{?#{m:lazygit,#{pane_current_command}},#7aa2f7,#{?#{m:bun,#{pane_current_command}},#f9c859,#{?#{m:agent,#{pane_current_command}},#e9729d,#{@thm_fg}}}}}}}"

# Tab label: show app name for custom apps, directory for everything else
set -g @_w_label "#{?#{m:claude,#{pane_current_command}},claude ,#{?#{m:codex,#{window_name}},codex ,#{?#{m:nvim,#{pane_current_command}},nvim ,#{?#{m:lazygit,#{pane_current_command}},lazygit ,#{?#{m:bun,#{pane_current_command}},bun ,#{?#{m:agent,#{pane_current_command}},cursor ,#{b:pane_current_path} }}}}}}"

set -g window-status-format "#[fg=#{E:@_w_nbg},bg=#{@thm_mantle}]#[fg=#{E:@_w_nfg},bg=#{E:@_w_nbg}] #I #[fg=#{E:@_w_tfg},bg=#{E:@_w_tbg}] #{E:@_w_label}#[fg=#{E:@_w_tbg},bg=#{@thm_mantle}]#[default]"

set -g window-status-current-format "#[fg=#{E:@_wc_nbg},bg=#{@thm_mantle}]#[fg=#{E:@_wc_nfg},bg=#{E:@_wc_nbg}] #I #[fg=#{E:@_wc_tfg},bg=#{E:@_wc_tbg}] #{E:@_w_label}#[fg=#{E:@_wc_tbg},bg=#{@thm_mantle}]#[default]"

# ====== Status Bar ======
set -g status-position top
set -g status-interval 5                 # Refresh status every 5s (default 15)
set -g status-left-length 100
set -g status-right-length 100
set -g status-left "#{E:@catppuccin_status_session}  "

# Right side: mode flags, directory, git branch, time
set -g @catppuccin_date_time_text " %H:%M"

# Git branch (lightweight, no gitmux needed)
set -g @catppuccin_gitmux_text " #(cd #{pane_current_path} && git rev-parse --abbrev-ref HEAD 2>/dev/null || echo '-')"

# Keyboard layout (reuses Waybar language script + Hyprland watcher)
source -F "/home/artyom/.config/tmux/status/language.conf"

# Mode indicators come first so they're always visible
set -g status-right "#[fg=#{@thm_peach}]#{?client_prefix,󰌌 PREFIX ,}#[fg=#{@thm_yellow}]#{?pane_in_mode,󰆏 COPY ,}#[fg=#{@thm_green}]#{?window_zoomed_flag, ZOOM ,}"
set -ag status-right "#{E:@catppuccin_status_directory}"
set -ag status-right "#{E:@catppuccin_status_gitmux}"
set -ag status-right "#{E:@catppuccin_status_language}"
set -ag status-right "#{E:@catppuccin_status_date_time}"

# Pane borders and mode/message theming
set -g pane-border-style "fg=#{@thm_surface_0}"
set -g pane-active-border-style "fg=#{@thm_mauve}"
set -g mode-style "bg=#{@thm_mauve},fg=#{@thm_crust}"
# fill= is required: without it the prompt only paints the characters it
# writes, leaving the rest of the status line visible underneath.
set -g message-style "bg=#{@thm_surface_0},fg=#{@thm_fg},fill=#{@thm_surface_0}"
set -g message-command-style "bg=#{@thm_surface_0},fg=#{@thm_fg},fill=#{@thm_surface_0}"
